<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  <title>Tiginal</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css">
</head>
<body>
  <div id="app">
    <!-- Left sidebar -->
    <div id="sidebar">
      <div id="sidebar-icons">
        <button id="sidebar-terminal" class="sidebar-icon active" title="Terminal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="4 17 10 11 4 5"></polyline>
            <line x1="12" y1="19" x2="20" y2="19"></line>
          </svg>
        </button>
        <button id="sidebar-servers" class="sidebar-icon" title="SSH Servers">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
        </button>
        <div class="sidebar-spacer"></div>
        <button id="sidebar-settings" class="sidebar-icon" title="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Main content area -->
    <div id="main-content">
      <!-- Tab bar -->
      <div id="tab-bar">
        <div id="tabs"></div>
        <button id="new-tab-btn" class="tab-bar-btn" title="New Tab (⌘T)">+</button>
        <button id="scroll-tabs-left" class="tab-bar-btn" title="Scroll Left">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <button id="scroll-tabs-right" class="tab-bar-btn" title="Scroll Right">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
        <button id="ai-toggle" class="ai-toggle-btn" title="Toggle AI Panel (⌘⇧A)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"></path>
            <circle cx="8" cy="14" r="2"></circle>
            <circle cx="16" cy="14" r="2"></circle>
          </svg>
        </button>
      </div>

      <!-- Terminal container -->
      <div id="terminal-container">
        <div id="terminals"></div>
      </div>

      <!-- Command input area -->
      <div id="command-input-container">
        <textarea id="command-input" placeholder="Enter command..." rows="1"></textarea>
        <div id="command-buttons">
          <button id="cmd-paste" class="cmd-btn" title="Paste to terminal">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
            </svg>
          </button>
          <button id="cmd-send" class="cmd-btn primary" title="Send command (⌘↵)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- AI Panel (right side) -->
    <div id="ai-panel" class="collapsed">
      <div class="ai-panel-resize" id="ai-panel-resize"></div>
      <div id="ai-panel-header">
        <span class="ai-panel-title">AI Assistant</span>
        <div class="ai-panel-actions">
          <button id="ai-history-btn" class="ai-header-btn" title="Conversation History">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
          </button>
        </div>
      </div>
      <div id="ai-messages"></div>
      <div id="ai-input-container">
        <div class="model-picker" id="model-picker">
          <button class="model-picker-trigger" id="model-picker-trigger">
            <span class="model-picker-label">Select model...</span>
            <svg class="model-picker-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <div class="model-picker-list hidden" id="model-picker-list"></div>
        </div>
        <div id="ai-input-row">
          <textarea id="ai-input" placeholder="Ask AI..." rows="1"></textarea>
          <button id="ai-send" class="cmd-btn primary" title="Send">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Setup CommonJS environment and fix module paths
    const path = require('path');
    const Module = require('module');
    
    // Add node_modules to module search path
    const projectRoot = path.join(__dirname, '../../');
    Module.globalPaths.unshift(path.join(projectRoot, 'node_modules'));
    
    // Load the renderer script
    require('../../dist/renderer/renderer/index.js');
  </script>
</body>
</html>
