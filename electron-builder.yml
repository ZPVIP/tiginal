appId: com.tiginal.app
productName: Tiginal
directories:
  output: release
  buildResources: build

# `npm run release` uploads to a draft GitHub release; review it on GitHub before publishing.
publish:
  provider: github
  owner: ZPVIP
  repo: tiginal
  releaseType: draft

# No Developer ID yet: skip signing with any certificate in the keychain and apply an ad-hoc signature instead.
afterSign: scripts/adhoc-sign-mac.cjs

# argon2, node-pty, and better-sqlite3 ship N-API prebuilds for every platform and architecture, so nothing
# needs compiling for Electron. A rebuild would only produce binaries for the build machine's architecture.
npmRebuild: false

files:
  - bin/**/*
  - dist/**/*
  - src/renderer/index.html
  - src/renderer/styles.css
  - node_modules/**/*
  - package.json
  # Local compiler output matches only the build machine and would shadow the per-architecture prebuilds.
  - "!node_modules/{argon2,node-pty,better-sqlite3}/build/**"
  - "!node_modules/{argon2,node-pty}/bin/**"

asarUnpack:
  - bin/**/*
  - dist/main/cli/**/*
  - dist/main/shared/credentials/**/*
  # Native modules load from disk instead of a temporary copy, and node-pty runs spawn-helper from app.asar.unpacked.
  - "**/*.node"
  - node_modules/node-pty/prebuilds/**

extraResources:
  - from: resources/model-catalog/api.json
    to: model-catalog/api.json
  - from: resources/model-catalog/models.json
    to: model-catalog/models.json

mac:
  category: public.app-category.developer-tools
  identity: null
  extendInfo:
    NSMicrophoneUsageDescription: Tiginal uses microphone audio for speech recognition and recording.
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]

win:
  target:
    - target: nsis
      arch: [x64]

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
