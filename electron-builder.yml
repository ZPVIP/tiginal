appId: com.tiginal.app
productName: Tiginal
directories:
  output: release
  buildResources: build

# Disable auto-update publishing
publish: null

files:
  - dist/**/*
  - src/renderer/index.html
  - src/renderer/styles.css
  - node_modules/**/*
  - package.json

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]

win:
  target:
    - target: nsis
      arch: [x64]

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
